name: Clipmaker Runner
description: Run clipmaker without exposing setup steps

runs:
  using: "composite"
  steps:
    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
      shell: bash

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install project
      run: |
        pip install .
      shell: bash

    - name: Run clipmaker
      run: |
        python -m clipmaker
      shell: bash
